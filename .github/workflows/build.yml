name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - run: bash setup.sh
      - run: cd app && flutter build apk --release
      - run: cp app/build/app/outputs/flutter-apk/app-release.apk mahesh-jarvis.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: mahesh-jarvis.apk
