name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q mahesh_jarvis.zip
      - name: Fix voice_pipeline
        run: |
          sed -i 's/if (!await _vp.hasRecordAudioPermission())/if (await _vp.hasRecordAudioPermission() != true)/' mahesh_jarvis/source/lib/services/voice_pipeline.dart
      - name: Pin plugin versions
        run: |
          sed -i -E \
            -e 's/^  flutter_voice_processor:.*/  flutter_voice_processor: ^1.1.0/' \
            -e 's/^  flutter_tts:.*/  flutter_tts: 4.2.0/' \
            -e 's/^  speech_to_text:.*/  speech_to_text: 7.0.0/' \
            -e 's/^  flutter_contacts:.*/  flutter_contacts: ^1.1.9/' \
            -e 's/^  permission_handler:.*/  permission_handler: ^11.3.1/' \
            mahesh_jarvis/source/pubspec.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - run: cd mahesh_jarvis && bash setup.sh
      - run: cd mahesh_jarvis/app && flutter build apk --release
      - run: cp mahesh_jarvis/app/build/app/outputs/flutter-apk/app-release.apk mahesh-jarvis.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: mahesh-jarvis.apk
