name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip mahesh_jarvis.zip
      - run: grep -rl "eagle_flutter" mahesh_jarvis | xargs -r sed -i '/eagle_flutter/d'
      - run: cat -n mahesh_jarvis/app/lib/screens/setup_screen.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cd mahesh_jarvis && bash setup.sh
      - run: cd mahesh_jarvis/app && flutter build apk --release
      - run: cp mahesh_jarvis/app/build/app/outputs/flutter-apk/app-release.apk mahesh-jarvis.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: mahesh-jarvis.apk
